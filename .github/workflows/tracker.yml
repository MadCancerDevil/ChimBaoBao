name: Stock Tracker

on:
  schedule:
    # Du phong: GitHub tu chay theo lich nay, nhung KHONG dam bao dung
    # gio (co the tre 15-90 phut khi tai cao). Lich chinh xac do
    # Cloudflare Worker Cron Trigger chu dong goi qua workflow_dispatch
    # ben duoi - xem HUONG-DAN.md.
    - cron: "*/5 2-7 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "che do chay"
        required: false
        default: "check"
        type: choice
        options: ["check", "report"]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Xac dinh che do chay
        id: mode
        run: |
          # Uu tien input tuong minh khi duoc goi qua workflow_dispatch
          # (tu Cloudflare Worker hoac bam nut Run workflow thu cong).
          # Chi khi khong co input (tuc GitHub tu kich hoat theo lich
          # du phong) moi doan qua chuoi cron da kich hoat.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ]; then
            echo "action=report" >> "$GITHUB_OUTPUT"
          else
            echo "action=check" >> "$GITHUB_OUTPUT"
          fi

      - name: Chay tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ steps.mode.outputs.action }}

      - name: Luu trang thai & cau hinh
        run: |
          git config user.name "stock-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json config.json portfolio.json queue
          if git diff --cached --quiet; then
            echo "Khong co thay doi can luu"
            exit 0
          fi
          git commit -m "update state [skip ci]"
          # Keo thay doi tu xa ve truoc (neu nguoi dung vua sua config
          # tren web) roi moi push, thu lai toi da 3 lan
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "${GITHUB_REF_NAME}" && exit 0
            echo "Push that bai, thu lai lan $i..."
            sleep 3
          done
          echo "::warning::Khong luu duoc trang thai sau 3 lan thu"
